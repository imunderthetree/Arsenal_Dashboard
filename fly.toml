# fly.toml app configuration file for Arsenal Dashboard
# IMPORTANT: Replace "your-app-name" with your actual Fly.io app name before deploying

app = "your-app-name"  # TODO: Change this to your Fly.io app name
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  DATABASE_PATH = "/app/data/arsenal.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/test"

[mounts]
  source = "arsenal_data"
  destination = "/app/data"
